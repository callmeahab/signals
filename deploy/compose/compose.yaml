services:
  signals:
    image: signals-collector:local
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgres://signals:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres/signals
      SIGNALS_BIND: 0.0.0.0:8300
      SIGNALS_PUBLIC_URL: ${SIGNALS_PUBLIC_URL:?Set SIGNALS_PUBLIC_URL}
      SIGNALS_CORS_ORIGINS: ${SIGNALS_CORS_ORIGINS:?Set SIGNALS_CORS_ORIGINS}
      SIGNALS_ADMIN_TOKEN: ${SIGNALS_ADMIN_TOKEN:?Set SIGNALS_ADMIN_TOKEN}
      SIGNALS_SESSION_SECRET: ${SIGNALS_SESSION_SECRET:?Set SIGNALS_SESSION_SECRET}
      SIGNALS_BOOTSTRAP_EMAIL: ${SIGNALS_BOOTSTRAP_EMAIL:?Set SIGNALS_BOOTSTRAP_EMAIL}
      SIGNALS_BOOTSTRAP_PASSWORD: ${SIGNALS_BOOTSTRAP_PASSWORD:?Set SIGNALS_BOOTSTRAP_PASSWORD}
    ports:
      - "${SIGNALS_BIND_ADDRESS:-127.0.0.1}:8300:8300"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
  postgres:
    shm_size: 1g
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: signals
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: signals
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, signals, -d, signals]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    init: true
volumes:
  pgdata18:
