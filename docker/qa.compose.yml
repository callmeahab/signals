x-collector: &collector
  image: signals:qa
  build: {context: .., dockerfile: docker/Dockerfile}
  cpus: 2
  environment: &environment
    DATABASE_URL: postgres://signals:signals@postgres/signals_test
    SIGNALS_ADMIN_TOKEN: signals-completion-qa-admin-token-32-chars
    SIGNALS_SESSION_SECRET: signals-completion-qa-session-secret-32-chars
    SIGNALS_BOOTSTRAP_EMAIL: owner@signals.test
    SIGNALS_BOOTSTRAP_PASSWORD: signals-test-password
    SIGNALS_PUBLIC_URL: http://127.0.0.1:8352
    SIGNALS_CORS_ORIGINS: http://127.0.0.1:8350,http://127.0.0.1:8351
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4317
    OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    OTEL_SERVICE_NAME: signals-completion-qa
    OTEL_BSP_SCHEDULE_DELAY: 500
    RUST_LOG: signals=info,signals_server=info
  depends_on:
    postgres: {condition: service_healthy}
    otel: {condition: service_started}
  stop_grace_period: 15s
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: signals
      POSTGRES_PASSWORD: signals
      POSTGRES_DB: signals_test
    ports: ['127.0.0.1:18432:5432']
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U signals -d signals_test']
      interval: 1s
      timeout: 3s
      retries: 30
  signals:
    <<: *collector
    ports: ['127.0.0.1:8350:8300']
  replica:
    <<: *collector
    ports: ['127.0.0.1:8351:8300']
  proxy:
    image: nginx:1.29
    volumes: ['./qa.nginx.conf:/etc/nginx/nginx.conf:ro']
    ports: ['127.0.0.1:8352:80']
    depends_on: [signals,replica]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ['127.0.0.1:19090:9090']
    depends_on: [signals]
  otel:
    image: otel/opentelemetry-collector:0.131.0
    command: ['--config=/etc/otel.yml']
    volumes: ['./otel.yml:/etc/otel.yml:ro']
  k6:
    image: grafana/k6:1.3.0
    profiles: [bench]
    volumes: ['../bench:/bench']
    entrypoint: ['k6']
