name: Signals release
on:
  push:
    tags: ['signals-v*.*.*']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/release-check.py
      - run: python3 scripts/check-version.py "${GITHUB_REF_NAME}"
  checks:
    needs: validate
    uses: ./.github/workflows/signals.yml
  image:
    needs: checks
    runs-on: ubuntu-latest
    environment: signals-release
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Release version
        id: version
        run: echo "value=${GITHUB_REF_NAME#signals-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/signals
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.value }}
      - uses: docker/build-push-action@v6
        with: {context: '.', file: docker/Dockerfile, platforms: 'linux/amd64,linux/arm64', push: true, tags: '${{ steps.meta.outputs.tags }}', labels: '${{ steps.meta.outputs.labels }}'}
  binaries:
    needs: checks
    strategy:
      matrix:
        include:
          - {runner: ubuntu-latest, target: x86_64-unknown-linux-musl}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: '${{ matrix.target }}'}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - run: cargo build --locked --release --bin signals --target ${{ matrix.target }}
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      - run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/signals release/signals-${{ matrix.target }}
          file release/signals-${{ matrix.target }} | tee release/file-${{ matrix.target }}.txt
          ldd release/signals-${{ matrix.target }} > release/ldd-${{ matrix.target }}.txt 2>&1 || true
          grep -Eq 'static|statically linked' release/file-${{ matrix.target }}.txt
          sha256sum release/signals-${{ matrix.target }} > release/SHA256SUMS-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with: {name: 'signals-${{ matrix.target }}', path: release/}
  github-release:
    needs: [image, binaries]
    runs-on: ubuntu-latest
    environment: signals-release
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'signals-*-unknown-linux-musl', path: release, merge-multiple: true}
      - run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
  npm:
    needs: checks
    runs-on: ubuntu-latest
    environment: signals-release
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', registry-url: 'https://registry.npmjs.org'}
      - run: npm install --global npm@latest
      - run: npm ci --no-audit --no-fund && npm run build:ui
        working-directory: web
      - run: npm publish --workspace @mcpramen/signals-ui --access public --provenance
        working-directory: web
