name: Signals checks
on: [push, pull_request, workflow_call]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm
        env: {POSTGRES_USER: signals, POSTGRES_PASSWORD: signals, POSTGRES_DB: signals_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U signals" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://signals:signals@127.0.0.1:5432/signals_test
      TEST_DATABASE_URL: postgres://signals:signals@127.0.0.1:5432/signals_test
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: {bun-version-file: '.bun-version'}
      - uses: dtolnay/rust-toolchain@1.99.0
        with: {components: 'rustfmt, clippy'}
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run check && bun run build
        working-directory: web
      - run: bunx --bun playwright install --with-deps chromium
        working-directory: web
      - run: bun run test
        working-directory: web
      - run: python3 examples/smoke.py
      - run: cargo fmt --all --check
      - run: cargo run --locked -p signals-xtask -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --bin signals
      - run: target/debug/signals migrate
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f .sqlx/dev.sql
      - run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features rustls,postgres
      - run: cargo sqlx prepare --check --workspace -- --all-targets
      - run: cargo test --locked -p signals-server --test integration --test rollup_properties -- --ignored --test-threads=1
      - run: python3 scripts/ci-conformance.py
      - run: bun run test:next
        working-directory: web
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: signals-browser-artifacts, path: web/artifacts}
  operations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -p signals-ci-qa -f docker/qa.compose.yml up --build -d
      - run: python3 scripts/runtime-qa.py --project signals-ci-qa
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: signals-runtime-evidence, path: bench/artifacts}
      - run: docker compose -p signals-ci-qa -f docker/qa.compose.yml logs --no-color > /tmp/signals-qa.log
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: signals-operations-log, path: /tmp/signals-qa.log}
      - run: docker compose -p signals-ci-qa -f docker/qa.compose.yml down -v
        if: always()
